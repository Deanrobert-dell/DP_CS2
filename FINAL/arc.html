<!DOCTYPE html>
<html>
<head>
    <title>ARC Raiders 2D</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; background: #2b2b2b; }
        #ui { position: absolute; top: 10px; left: 10px; color: #00ffcc; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        Scraps Collected: <span id="score">0</span><br>
        Health: <span id="health">100</span>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const healthEl = document.getElementById('health');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- Game State ---
const player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 20,
    color: '#00ffcc',
    speed: 4,
    health: 100,
    score: 0
};

const keys = {};
const bullets = [];
const enemies = [];
let lastShot = 0;

// --- Controls ---
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('mousedown', shoot);

function shoot() {
    const now = Date.now();
    if (now - lastShot < 200) return; // Fire rate limit

    const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
    bullets.push({
        x: player.x,
        y: player.y,
        vx: Math.cos(angle) * 8,
        vy: Math.sin(angle) * 8
    });
    lastShot = now;
}

let mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

// --- Logic ---
function spawnEnemy() {
    if (enemies.length < 5) {
        enemies.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: 25,
            health: 3,
            color: '#ff4444' // Red Machines
        });
    }
}

function update() {
    // Player Movement
    if (keys['KeyW']) player.y -= player.speed;
    if (keys['KeyS']) player.y += player.speed;
    if (keys['KeyA']) player.x -= player.speed;
    if (keys['KeyD']) player.x += player.speed;

    // Bullet Logic
    bullets.forEach((b, i) => {
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
    });

    // Enemy Logic
    enemies.forEach((en, i) => {
        const dx = player.x - en.x;
        const dy = player.y - en.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        // Move toward player
        en.x += (dx / dist) * 1.5;
        en.y += (dy / dist) * 1.5;

        // Bullet Collision
        bullets.forEach((b, bi) => {
            if (Math.hypot(b.x - en.x, b.y - en.y) < en.size) {
                en.health--;
                bullets.splice(bi, 1);
                if (en.health <= 0) {
                    enemies.splice(i, 1);
                    player.score += 10;
                    scoreEl.innerText = player.score;
                }
            }
        });

        // Player Collision
        if (dist < player.size + en.size) {
            player.health -= 0.5;
            healthEl.innerText = Math.floor(player.health);
            if (player.health <= 0) location.reload(); // Game Over
        }
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Player (with aim line)
    ctx.strokeStyle = 'rgba(0, 255, 204, 0.2)';
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(mouseX, mouseY);
    ctx.stroke();

    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
    ctx.fill();

    // Draw Bullets
    ctx.fillStyle = 'yellow';
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
    });

    // Draw Enemies
    enemies.forEach(en => {
        ctx.fillStyle = en.color;
        ctx.fillRect(en.x - en.size/2, en.y - en.size/2, en.size, en.size);
    });
}

function loop() {
    update();
    draw();
    if (Math.random() < 0.02) spawnEnemy();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
